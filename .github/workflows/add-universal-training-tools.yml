name: Wire universal training operations
on:
  push:
    branches: [feature/universal-training-tools]
permissions:
  contents: write
jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch compatibility bridge
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/compatibility-bridge.ts')
          s=p.read_text()
          anchor='import { buildAthleteIntelligence, buildRecoveryModel, buildResidualFatigueModel, buildSessionFingerprints, buildPerformanceTrend, buildDoseOptimizer, buildEventReadiness, buildAnomalyAndQuality } from "./athlete-intelligence.js";\n'
          ins=anchor+'import { trainingDataStatus, setupCheck, listProviderActivities, trainingTrends, compareActivities, importActivityFile } from "./providers/training-data-analytics.js";\n'
          if 'trainingDataStatus, setupCheck' not in s:
            if anchor not in s: raise SystemExit('import anchor missing')
            s=s.replace(anchor,ins,1)
          op_anchor='export const READ_OPERATIONS: OperationDescriptor[] = [\n'
          ops='''export const READ_OPERATIONS: OperationDescriptor[] = [\n  { name: "training_data_status", description: "Return provider availability, capabilities and the default training-data provider without exposing secrets.", input: {} },\n  { name: "setup_check", description: "Run a safe installation/configuration diagnostic for Node, COROS, optional providers and file analysis.", input: {} },\n  { name: "list_training_providers", description: "List configured training-data providers, their availability and capabilities.", input: {} },\n  { name: "list_provider_activities", description: "List normalized activities from any provider implementing the activities capability.", input: { providerId: "coros|strava|garmin", startDate: "YYYY-MM-DD", endDate: "YYYY-MM-DD", page: "optional integer", size: "optional integer" } },\n  { name: "training_trends", description: "Aggregate normalized training volume/load trends over configurable 7/28/90-style windows for any activity provider.", input: { providerId: "coros|strava|garmin", endDate: "YYYY-MM-DD", windows: "optional integer[] 1..365" } },\n  { name: "compare_activities", description: "Compare up to 10 normalized activities from any activity provider using a first-activity baseline.", input: { providerId: "coros|strava|garmin", startDate: "YYYY-MM-DD", endDate: "YYYY-MM-DD", activityIds: "optional string[]" } },\n  { name: "import_activity_file", description: "Analyze a base64 FIT file and return detailed FIT analysis plus a neutral activity summary; no platform account required.", input: { fitBase64: "base64 FIT bytes", name: "optional display name" } },\n'''
          if 'name: "training_data_status"' not in s:
            if op_anchor not in s: raise SystemExit('operations anchor missing')
            s=s.replace(op_anchor,ops,1)
          schema_anchor='const CalibrationSchema = z.object({\n'
          schemas='''const ProviderActivitiesSchema = z.object({ providerId: z.string().min(1).default("coros"), startDate: z.string().min(1), endDate: z.string().min(1), page: z.number().int().min(1).max(1000).default(1), size: z.number().int().min(1).max(100).default(100) });\nconst TrainingTrendsSchema = z.object({ providerId: z.string().min(1).default("coros"), endDate: z.string().min(1), windows: z.array(z.number().int().min(1).max(365)).min(1).max(12).default([7,28,90]) });\nconst CompareActivitiesSchema = z.object({ providerId: z.string().min(1).default("coros"), startDate: z.string().min(1), endDate: z.string().min(1), activityIds: z.array(z.string().min(1)).max(10).optional() });\nconst ImportActivityFileSchema = z.object({ fitBase64: z.string().min(1), name: z.string().min(1).max(200).optional() });\n\nconst CalibrationSchema = z.object({\n'''
          if 'const ProviderActivitiesSchema' not in s:
            if schema_anchor not in s: raise SystemExit('schema anchor missing')
            s=s.replace(schema_anchor,schemas,1)
          handler_anchor='  const auth = await requireAuth();\n'
          handlers='''  if (operation === "training_data_status" || operation === "list_training_providers") return bridgeEnvelope(operation, await trainingDataStatus());\n  if (operation === "setup_check") return bridgeEnvelope(operation, await setupCheck());\n  if (operation === "list_provider_activities") { const input = ProviderActivitiesSchema.parse(rawInput); return bridgeEnvelope(operation, await listProviderActivities(input)); }\n  if (operation === "training_trends") { const input = TrainingTrendsSchema.parse(rawInput); return bridgeEnvelope(operation, await trainingTrends(input.providerId, input.endDate, input.windows)); }\n  if (operation === "compare_activities") { const input = CompareActivitiesSchema.parse(rawInput); return bridgeEnvelope(operation, await compareActivities(input.providerId, input.startDate, input.endDate, input.activityIds)); }\n  if (operation === "import_activity_file") { const input = ImportActivityFileSchema.parse(rawInput); return bridgeEnvelope(operation, await importActivityFile(input.fitBase64, input.name)); }\n\n  const auth = await requireAuth();\n'''
          if 'operation === "training_data_status" || operation === "list_training_providers"' not in s:
            if handler_anchor not in s: raise SystemExit('handler anchor missing')
            s=s.replace(handler_anchor,handlers,1)
          p.write_text(s)
          PY
      - name: Add tests
        run: |
          cat > src/__tests__/training-data-analytics.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";
          import { summarizeActivities } from "../providers/training-data-analytics.js";
          import type { TrainingActivitySummary } from "../providers/training-data-types.js";

          const activity = (id: string, overrides: Partial<TrainingActivitySummary> = {}): TrainingActivitySummary => ({
            activityId: id, date: "2026-09-01", name: id, sportType: null, sportName: "cycling", startTime: null,
            durationSeconds: 3600, distanceMeters: 30000, averageHeartRate: 140, maximumHeartRate: 170,
            calories: null, trainingLoad: 100, averagePower: 200, normalizedPower: 220, elevationGain: 500, ...overrides,
          });

          describe("universal training analytics", () => {
            it("summarizes normalized activities without inventing missing data", () => {
              const result = summarizeActivities([activity("a"), activity("b", { durationSeconds: 1800, distanceMeters: 10000, trainingLoad: null })]);
              expect(result.count).toBe(2);
              expect(result.durationSeconds).toBe(5400);
              expect(result.distanceMeters).toBe(40000);
              expect(result.trainingLoad).toBe(100);
              expect(result.bySport[0]).toMatchObject({ sport: "cycling", count: 2 });
            });
          });
          EOF
      - name: Validate
        run: |
          npm ci
          npm test
          npm run build
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/compatibility-bridge.ts src/__tests__/training-data-analytics.test.ts
          git commit -m 'feat: expose universal training operations'
          git push origin feature/universal-training-tools

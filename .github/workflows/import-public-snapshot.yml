name: Import validated public snapshot

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download validated snapshot
        env:
          SNAPSHOT_URL: "https://sdmntprwestus.oaiusercontent.com/files/00000000-ec10-8230-93d6-9cd2fc7a3487/raw?se=2026-09-14T10%3A02%3A37Z&sp=r&sv=2026-02-06&sr=b&scid=f0349bfc-dfb1-576a-a698-3addcd870a76&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T01%3A47%3A02Z&ske=2026-09-15T01%3A47%3A02Z&sks=b&skv=2026-02-06&sig=WBXWe3%2B1fMV6vem3Y9P6SNq3OdX/JyxxGd0Ryf0aZT4%3D"
        run: |
          set -euo pipefail
          curl -fL "$SNAPSHOT_URL" -o /tmp/public-clean-snapshot.zip
          mkdir -p /tmp/artifact /tmp/source
          unzip -q /tmp/public-clean-snapshot.zip -d /tmp/artifact
          (cd /tmp/artifact && sha256sum -c public-snapshot.sha256)
          tar -xzf /tmp/artifact/public-snapshot.tar.gz -C /tmp/source

      - name: Prepare public source tree
        run: |
          set -euo pipefail
          rm -f /tmp/source/gitleaks
          rm -rf /tmp/source/.github/workflows
          rm -f /tmp/source/docs/public-release-cleanup.md
          rm -f /tmp/source/docs/legacy-nested-copy.md
          rm -f /tmp/source/CLAUDE.md
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github/workflows/' \
            /tmp/source/ ./

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Scan final public tree
        run: |
          set -euo pipefail
          VERSION="8.28.0"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | tar -xz -C /tmp gitleaks
          /tmp/gitleaks dir . --redact --no-banner

      - name: Commit clean public source
        run: |
          set -euo pipefail
          rm -rf dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows'
          git commit -m "Import validated clean public source"
          git push origin main

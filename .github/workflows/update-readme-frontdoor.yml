name: Update README frontdoor
on:
  push:
    branches: [feature/readme-frontdoor]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update README
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('README.md')
          s=p.read_text()
          marker='MCP server for creating and managing COROS strength, running and cycling workouts through the Training Hub API. It includes calendar management, weekly planning, validation and backups. This fork adds a Streamable HTTP endpoint for a private ChatGPT plugin while preserving stdio compatibility.\n'
          block='''\n\n## Try it in 2 minutes — no credentials required\n\nWant to see the training analytics before connecting any account? Start the synthetic demo provider:\n\n```bash\nnpm ci\nnpm run demo\n```\n\nThen check the installation safely:\n\n```bash\nnpm run doctor\n```\n\nDemo mode uses synthetic running, cycling and trail activities only. It never reads COROS, Strava or Garmin accounts.\n\n**Quick start:** [English](docs/QUICKSTART.md) · [Español](docs/QUICKSTART-ES.md)  \n**Free/self-host connection guide:** [English](docs/FREE-CONNECTION-GUIDE.md) · [Español](docs/FREE-CONNECTION-GUIDE-ES.md)  \n**Deployment:** `render.yaml` is included for a simple Render Docker deployment.\n\n### What you can try in demo mode\n\nUse the stable `coros_read` bridge with `providerId: "demo"` to explore `athlete_snapshot`, `training_trends`, `weekly_training_summary`, `personal_bests`, `activity_anomalies`, `similar_activities` and the rest of the provider-neutral analytics.\n'''
          if '## Try it in 2 minutes — no credentials required' not in s:
              if marker not in s: raise SystemExit('README marker not found')
              p.write_text(s.replace(marker, marker+block))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: add public quickstart frontdoor'
          git push origin feature/readme-frontdoor
